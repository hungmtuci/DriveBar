name: Build & Release DriveBar macOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build Universal Binary (.app, .dmg, .zip)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build & Package DriveBar
        run: |
          chmod +x ./build_drivebar.sh
          ./build_drivebar.sh
          ls -lh dist/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DriveBar-macOS-Installer
          path: dist/*

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/*.zip
